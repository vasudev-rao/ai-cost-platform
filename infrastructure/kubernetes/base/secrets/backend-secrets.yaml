# IMPORTANT: In production, use Sealed Secrets or AWS Secrets Manager
# This file is a template — never commit real secrets to git
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ai-cost-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME@rds-endpoint:5432/ai_cost_platform"
  REDIS_URL: "redis://redis-service:6379/0"
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_32_CHAR_RANDOM_STRING"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "ai-cost-platform-data-prod"
