apiVersion: v1
kind: Namespace
metadata:
  name: ai-cost-platform
  labels:
    name: ai-cost-platform
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-cost-backend
  namespace: ai-cost-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ai-cost-platform-backend-role
