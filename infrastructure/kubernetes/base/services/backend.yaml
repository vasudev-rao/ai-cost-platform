apiVersion: v1
kind: Service
metadata:
  name: ai-cost-backend
  namespace: ai-cost-platform
  labels:
    app: ai-cost-backend
spec:
  type: ClusterIP
  selector:
    app: ai-cost-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-cost-frontend
  namespace: ai-cost-platform
spec:
  type: ClusterIP
  selector:
    app: ai-cost-frontend
  ports:
    - port: 3000
      targetPort: 3000
